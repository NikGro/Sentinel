name: Kamera-Test

# Prüft die Kamera beim Anheften automatisch im Simulator (Zoomen, Drehen, Wischen, Folgen beim Fahren) und nimmt
# den Bildschirm dabei als Video auf. Ergebnis: Testbericht, Video, Bildschirmfotos und die Messdatei der App
# (kamera.jsonl, eine Zeile je Kamerabewegung) als Artefakt „Kamera-…“. Blockiert den Bau der App nicht.
on:
  push:
    branches: [main, "claude/**"]
    paths: ["ios/**", ".github/workflows/kamera.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kamera-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kamera:
    name: Kamera im Simulator prüfen
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Werkzeuge
        run: |
          which xcodegen || brew install xcodegen
          xcodegen generate

      - name: Simulator starten
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -E '^\s+iPhone' | head -1 | sed -E 's/^ +//; s/ \([0-9A-F-]{36}\).*//')
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b || true
          xcrun simctl privacy "$DEVICE" grant location-always de.nglab.sentinel || true
          xcrun simctl location "$DEVICE" set 53.5503,9.9930 || true

      - name: Bauen
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Sentinel.xcodeproj -scheme Sentinel \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build-kamera.log | xcbeautify --quiet

      - name: Kamera-Test mit Videoaufnahme
        run: |
          set -o pipefail
          mkdir -p build/kamera
          xcrun simctl io booted recordVideo --codec=h264 --force build/kamera/kamera.mp4 &
          REC=$!
          sleep 2
          # Jeder Testfall in einem eigenen Lauf: Ein zweiter Start der App im selben Lauf zeigte die Anmeldung statt der
          # Beispieldaten. Die Messdatei jedes Falls wird danach gesichert und mit Trennzeile zusammengeführt.
          DATA=""
          : > build/kamera/kamera.jsonl
          for T in testKameraBeimAnheften testKameraUnterUnruhe; do
            xcodebuild test-without-building \
              -project Sentinel.xcodeproj -scheme Sentinel \
              -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
              -derivedDataPath build/DerivedData \
              -resultBundlePath build/Kamera-$T.xcresult \
              -only-testing:SentinelUITests/KameraTests/$T \
              CODE_SIGNING_ALLOWED=NO 2>&1 | tee -a build-kamera-test.log | xcbeautify || STATUS=$?
            DATA=$(xcrun simctl get_app_container booted de.nglab.sentinel data 2>/dev/null || true)
            echo "{\"t\":0,\"ereignis\":\"TEST $T\"}" >> build/kamera/kamera.jsonl
            [ -n "$DATA" ] && cat "$DATA/Documents/kamera.jsonl" >> build/kamera/kamera.jsonl 2>/dev/null || true
          done
          kill -INT $REC || true
          sleep 3
          exit ${STATUS:-0}

      - name: Messdatei und Bildschirmfotos einsammeln
        if: always()
        run: |
          for R in build/Kamera-*.xcresult; do
            xcrun xcresulttool export attachments --path "$R" --output-path "build/kamera/fotos/$(basename "$R" .xcresult)" || true
          done
          grep -hE "(error|failed|XCTAssert|Test Case .* (passed|failed))" build-kamera-test.log | sort -u > build/kamera/ergebnis.txt || true
          cat build/kamera/ergebnis.txt || true
          ls -la build/kamera

      # Die Artefakte liegen bei einem Speicherdienst, den manche Umgebungen nicht erreichen; deshalb Auswertung,
      # Messdatei und verkleinerte Einzelbilder zusätzlich kodiert ins Protokoll (zwischen klaren Markierungen).
      - name: Auswertung ins Protokoll
        if: always()
        run: |
          which ffmpeg || brew install ffmpeg >/dev/null 2>&1 || true
          python3 ../tools/kamera_auswertung.py build/kamera 1 || true
          if [ -f build/kamera/kamera.jsonl ]; then
            echo "=====MESSDATEI-""ANFANG====="
            gzip -c build/kamera/kamera.jsonl | base64 -b 76
            echo "=====MESSDATEI-""ENDE====="
          fi
          if [ -d build/kamera/bilder ]; then
            mkdir -p build/klein
            i=0
            for f in build/kamera/bilder/*.png; do
              i=$((i+1)); [ $((i % 2)) -eq 0 ] || continue
              sips -s format jpeg -s formatOptions 45 -Z 300 "$f" --out "build/klein/$(basename "${f%.png}").jpg" >/dev/null 2>&1 || true
            done
            echo "=====BILDER-""ANFANG====="
            tar -C build/klein -czf - . | base64 -b 76
            echo "=====BILDER-""ENDE====="
          fi

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: Kamera-${{ github.run_number }}
          path: ios/build/kamera
          if-no-files-found: ignore
          retention-days: 14
