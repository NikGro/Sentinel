name: iOS-App

# Ablauf (schnell, ohne doppelte Arbeit):
#   Arbeitszweig: „Testen“ und „Archiv“ laufen parallel auf zwei Maschinen. Das Archiv (IPA) wird als Artefakt
#                 aufgehoben.
#   main:         Ist derselbe Stand (gleicher Commit) auf einem Arbeitszweig schon grün gebaut, übernimmt main
#                 dessen IPA und veröffentlicht sie nur noch in SideStore (wenige Minuten). Sonst wie oben.
#   Schnelle Spur: Steht „[schnell]“ in der Commit-Nachricht, laufen nur die Unit-Tests, nicht der UI-Rundgang.
#   Zwischenspeicher: Swift-Pakete und Build-Zwischenstände werden zwischen Läufen aufgehoben.
on:
  push:
    branches: [main, "claude/**"]
    paths: ["ios/**", ".github/workflows/ios.yml"]
    # Ein Versions-Tag (z. B. v0.1.0) erzeugt zusätzlich ein GitHub-Release mit der IPA.
    tags: ["v*"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Versions-Tag für ein GitHub-Release, z. B. v0.1.0 (leer = nur bauen)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  # Laufende Builds zu Ende bringen, damit jede Änderungsrunde ein Ergebnis liefert; nur der jeweils neueste wartet.
  cancel-in-progress: false

jobs:
  # Gibt es für genau diesen Commit schon einen grünen Lauf auf einem Arbeitszweig? Dann nichts neu bauen.
  reuse:
    name: Fertigen Build suchen
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - name: Grünen Lauf desselben Commits suchen
        id: find
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&status=success&per_page=30" \
            --jq '[.workflow_runs[] | select(.name == "iOS-App" and .head_branch != "main")][0].id // empty')
          if [ -n "$RUN" ] && gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/artifacts" --jq '.artifacts[].name' | grep -qx sentinel-ipa; then
            echo "Übernehme IPA aus Lauf $RUN."
            echo "run_id=$RUN" >> "$GITHUB_OUTPUT"
          else
            echo "Kein fertiger Build für $GITHUB_SHA, baue neu."
          fi

  test:
    name: Testen
    needs: reuse
    if: needs.reuse.outputs.run_id == ''
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/cache@v4
        with:
          path: |
            ios/build/SourcePackages
            ios/build/DerivedData
          # Bei Änderungen an Paketen oder Projekt ein neuer Zwischenspeicher; sonst wird der letzte weiterverwendet.
          key: ios-test-${{ hashFiles('ios/project.yml') }}-${{ github.sha }}
          restore-keys: ios-test-${{ hashFiles('ios/project.yml') }}-

      - name: Werkzeuge
        run: |
          xcodebuild -version
          which xcodegen || brew install xcodegen
          xcodegen generate

      - name: Tests im Simulator
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available | grep -E '^\s+iPhone' | head -1 | sed -E 's/^ +//; s/ \([0-9A-F-]{36}\).*//')
          echo "Simulator: $DEVICE"
          # Mit echtem Standort testen: Kamera folgt dem eigenen Punkt wie auf dem Gerät.
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl privacy "$DEVICE" grant location-always de.nglab.sentinel || true
          xcrun simctl location "$DEVICE" set 53.5503,9.9930 || true
          # Schnelle Spur: nur Unit-Tests. Der Kamera-Test hat einen eigenen Ablauf.
          if printf '%s' "$COMMIT_MESSAGE" | grep -q '\[schnell\]'; then
            SCOPE="-only-testing:SentinelTests"
            echo "::notice::Schnelle Spur: nur Unit-Tests"
          else
            SCOPE="-skip-testing:SentinelUITests/KameraTests"
          fi
          xcodebuild test \
            -project Sentinel.xcodeproj -scheme Sentinel \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -resultBundlePath build/Tests.xcresult \
            $SCOPE \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build-test.log | xcbeautify --quiet

      - name: Bildschirmfotos des Rundgangs
        if: always()
        run: |
          xcrun xcresulttool export attachments --path build/Tests.xcresult --output-path build/Bildschirmfotos || true
          ls build/Bildschirmfotos 2>/dev/null | head -40 || true

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: Bildschirmfotos-${{ github.run_number }}
          path: ios/build/Bildschirmfotos
          if-no-files-found: ignore
          retention-days: 14

      - name: Fehlerübersicht
        if: failure()
        run: |
          grep -hE "(error|warning: unre|failed|Test Case .* failed|Expectation failed)" build-*.log | sort -u | head -150 || true

  archive:
    name: Unsigniertes Archiv
    needs: reuse
    if: needs.reuse.outputs.run_id == ''
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/cache@v4
        with:
          path: |
            ios/build/SourcePackages
            ios/build/DerivedData
          key: ios-archive-${{ hashFiles('ios/project.yml') }}-${{ github.sha }}
          restore-keys: ios-archive-${{ hashFiles('ios/project.yml') }}-

      - name: Werkzeuge
        run: |
          which xcodegen || brew install xcodegen
          xcodegen generate

      - name: Archiv bauen
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Sentinel.xcodeproj -scheme Sentinel -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Sentinel.xcarchive \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build-archive.log | xcbeautify --quiet

      - name: IPA packen
        run: |
          rm -rf build/Payload build/ipa && mkdir -p build/Payload build/ipa
          cp -R build/Sentinel.xcarchive/Products/Applications/Sentinel.app build/Payload/
          (cd build && zip -qry ipa/Sentinel.ipa Payload)
          # Version und Build-Nummer neben die IPA, damit ein späterer Lauf auf main sie ohne Mac veröffentlichen kann.
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" build/Payload/Sentinel.app/Info.plist > build/ipa/version.txt
          echo "$BUILD_NUMBER" > build/ipa/build.txt
          ls -lh build/ipa

      - name: Fehlerübersicht
        if: failure()
        run: grep -hE "(error|failed)" build-archive.log | sort -u | head -80 || true

      - uses: actions/upload-artifact@v5
        with:
          name: sentinel-ipa
          path: ios/build/ipa
          if-no-files-found: error
          retention-days: 30

  # Veröffentlichen: neu gebaute IPA (nach grünen Tests) oder die übernommene eines Arbeitszweigs.
  publish:
    name: Veröffentlichen
    needs: [reuse, test, archive]
    if: >-
      always() &&
      (needs.reuse.outputs.run_id != '' || (needs.test.result == 'success' && needs.archive.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: sentinel-ipa
          path: ipa
          run-id: ${{ needs.reuse.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Version
        id: meta
        run: |
          echo "version=$(cat ipa/version.txt)" >> "$GITHUB_OUTPUT"
          echo "build=$(cat ipa/build.txt)" >> "$GITHUB_OUTPUT"
          echo "IPA $(cat ipa/version.txt) (Build $(cat ipa/build.txt))"

      # Für das Release unter festem Namen.
      - uses: actions/upload-artifact@v5
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '' || github.ref == 'refs/heads/main'
        with:
          name: release-ipa
          path: ipa/Sentinel.ipa
          if-no-files-found: error
          retention-days: 1

      # Veröffentlicht die IPA in der SideStore-Quelle des eigenen Servers.
      # Läuft auf main, bei einem Versions-Tag oder manuellem Start, und nur, wenn das Deploy-Token hinterlegt ist.
      - name: In SideStore-Quelle veröffentlichen
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          SENTINEL_DEPLOY_TOKEN: ${{ secrets.SENTINEL_DEPLOY_TOKEN }}
          SENTINEL_URL: ${{ vars.SENTINEL_URL || 'https://sentinel.ng-lab.de' }}
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD_NUMBER: ${{ steps.meta.outputs.build }}
        run: |
          if [ -z "$SENTINEL_DEPLOY_TOKEN" ]; then
            echo "::notice::SENTINEL_DEPLOY_TOKEN fehlt; SideStore-Veröffentlichung wird übersprungen."
            exit 0
          fi
          curl --fail --silent --show-error \
            -X POST "$SENTINEL_URL/api/v1/deploy/release?version=$VERSION&build=$BUILD_NUMBER" \
            -H "Authorization: Bearer $SENTINEL_DEPLOY_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @ipa/Sentinel.ipa

  # Eigener Job mit Schreibrecht nur für das Release; die übrigen Jobs dürfen das Repository nur lesen.
  # Ein Release entsteht auf drei Wegen:
  #   1. automatisch auf main, sobald die Versionsnummer in ios/project.yml noch kein Release hat,
  #   2. durch ein gepushtes Versions-Tag (v0.1.0),
  #   3. durch manuellen Start mit Angabe eines Tags.
  release:
    name: GitHub-Release
    if: always() && needs.publish.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '' || github.ref == 'refs/heads/main')
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Tag bestimmen
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          GIVEN: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          TAG="${GIVEN:-v$VERSION}"
          case "$TAG" in v[0-9]*.[0-9]*) ;; *) echo "Ungültiges Tag: $TAG"; exit 1 ;; esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG besteht bereits, nichts zu tun."
            echo "create=false" >> "$GITHUB_OUTPUT"
          else
            echo "create=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v5
        if: steps.tag.outputs.create == 'true'
        with:
          name: release-ipa
      - name: Release anlegen
        if: steps.tag.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          BUILD: ${{ github.run_number }}
        run: |
          mv Sentinel.ipa "Sentinel-${TAG#v}-${BUILD}.ipa"
          gh release create "$TAG" "Sentinel-${TAG#v}-${BUILD}.ipa" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SENTINEL ${TAG#v}" \
            --notes "Unsignierte IPA (Build ${BUILD}) für SideStore. Änderungen siehe CHANGELOG.md. Installation und Aktualisierung über die SideStore-Quelle des eigenen Servers; siehe docs/BETRIEB.md."
