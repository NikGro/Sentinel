name: iOS-App

on:
  push:
    branches: [main, "claude/**"]
    paths: ["ios/**", ".github/workflows/ios.yml"]
    # Ein Versions-Tag (z. B. v0.1.0) erzeugt zusätzlich ein GitHub-Release mit der IPA.
    tags: ["v*"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Versions-Tag für ein GitHub-Release, z. B. v0.1.0 (leer = nur bauen)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  # Laufende Builds zu Ende bringen, damit jede Änderungsrunde ein Ergebnis liefert; nur der jeweils neueste wartet.
  cancel-in-progress: false

jobs:
  build:
    name: Testen und unsignierte IPA bauen
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    outputs:
      version: ${{ steps.ipa.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Werkzeuge
        run: |
          xcodebuild -version
          which xcodegen || brew install xcodegen
          xcodegen generate

      - name: Tests im Simulator
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available | grep -E '^\s+iPhone' | head -1 | sed -E 's/^ +//; s/ \([0-9A-F-]{36}\).*//')
          echo "Simulator: $DEVICE"
          # Mit echtem Standort testen: Kamera folgt dem eigenen Punkt wie auf dem Gerät.
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl privacy "$DEVICE" grant location-always de.nglab.sentinel || true
          xcrun simctl location "$DEVICE" set 53.5503,9.9930 || true
          xcodebuild test \
            -project Sentinel.xcodeproj -scheme Sentinel \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/Tests.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build-test.log | xcbeautify --quiet

      - name: Bildschirmfotos des Rundgangs
        if: always()
        run: |
          xcrun xcresulttool export attachments --path build/Tests.xcresult --output-path build/Bildschirmfotos || true
          ls build/Bildschirmfotos 2>/dev/null | head -40 || true

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: Bildschirmfotos-${{ github.run_number }}
          path: ios/build/Bildschirmfotos
          if-no-files-found: ignore
          retention-days: 14

      - name: Fehlerübersicht
        if: failure()
        run: |
          grep -hE "(error|warning: unre|failed|Test Case .* failed|Expectation failed)" build-*.log | sort -u | head -150 || true

      - name: Unsigniertes Archiv
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Sentinel.xcodeproj -scheme Sentinel -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Sentinel.xcarchive \
            -derivedDataPath build/DerivedData \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build-archive.log | xcbeautify --quiet

      - name: IPA packen
        id: ipa
        run: |
          rm -rf build/Payload && mkdir -p build/Payload
          cp -R build/Sentinel.xcarchive/Products/Applications/Sentinel.app build/Payload/
          (cd build && zip -qry Sentinel.ipa Payload)
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" build/Payload/Sentinel.app/Info.plist)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -lh build/Sentinel.ipa

      - uses: actions/upload-artifact@v5
        with:
          name: Sentinel-${{ steps.ipa.outputs.version }}-${{ github.run_number }}
          path: ios/build/Sentinel.ipa
          if-no-files-found: error
          retention-days: 30

      # Für das Release-Job unter festem Namen, damit es die IPA ohne Kenntnis der Versionsnummer findet.
      - uses: actions/upload-artifact@v5
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '' || github.ref == 'refs/heads/main'
        with:
          name: release-ipa
          path: ios/build/Sentinel.ipa
          if-no-files-found: error
          retention-days: 1

      # Veröffentlicht die IPA in der SideStore-Quelle des eigenen Servers.
      # Läuft auf main, bei einem Versions-Tag oder manuellem Start, und nur, wenn das Deploy-Token hinterlegt ist.
      - name: In SideStore-Quelle veröffentlichen
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && env.SENTINEL_DEPLOY_TOKEN != ''
        env:
          SENTINEL_DEPLOY_TOKEN: ${{ secrets.SENTINEL_DEPLOY_TOKEN }}
          SENTINEL_URL: ${{ vars.SENTINEL_URL || 'https://sentinel.ng-lab.de' }}
          VERSION: ${{ steps.ipa.outputs.version }}
        run: |
          curl --fail --silent --show-error \
            -X POST "$SENTINEL_URL/api/v1/deploy/release?version=$VERSION&build=$BUILD_NUMBER" \
            -H "Authorization: Bearer $SENTINEL_DEPLOY_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @build/Sentinel.ipa

  # Eigener Job mit Schreibrecht nur für das Release; der Build-Job selbst darf das Repository nur lesen.
  # Ein Release entsteht auf drei Wegen:
  #   1. automatisch auf main, sobald die Versionsnummer in ios/project.yml noch kein Release hat,
  #   2. durch ein gepushtes Versions-Tag (v0.1.0),
  #   3. durch manuellen Start mit Angabe eines Tags.
  release:
    name: GitHub-Release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '' || github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Tag bestimmen
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          GIVEN: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          TAG="${GIVEN:-v$VERSION}"
          case "$TAG" in v[0-9]*.[0-9]*) ;; *) echo "Ungültiges Tag: $TAG"; exit 1 ;; esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG besteht bereits, nichts zu tun."
            echo "create=false" >> "$GITHUB_OUTPUT"
          else
            echo "create=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v5
        if: steps.tag.outputs.create == 'true'
        with:
          name: release-ipa
      - name: Release anlegen
        if: steps.tag.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          BUILD: ${{ github.run_number }}
        run: |
          mv Sentinel.ipa "Sentinel-${TAG#v}-${BUILD}.ipa"
          gh release create "$TAG" "Sentinel-${TAG#v}-${BUILD}.ipa" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SENTINEL ${TAG#v}" \
            --notes "Unsignierte IPA (Build ${BUILD}) für SideStore. Änderungen siehe CHANGELOG.md. Installation und Aktualisierung über die SideStore-Quelle des eigenen Servers; siehe docs/BETRIEB.md."
