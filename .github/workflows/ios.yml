name: iOS-App

on:
  push:
    branches: [main, "claude/**"]
    paths: [".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-existing-ipa:
    name: Vorhandene IPA auf Synology veröffentlichen
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Vorhandene Release-IPA herunterladen
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: v0.6.0
          IPA_FILE: Sentinel-0.6.0-70.ipa
        run: |
          gh release download "$RELEASE_TAG" \
            --repo "$REPOSITORY" \
            --pattern "$IPA_FILE" \
            --dir "$RUNNER_TEMP"
          test -s "$RUNNER_TEMP/$IPA_FILE"
          ls -lh "$RUNNER_TEMP/$IPA_FILE"

      - name: Unveränderte IPA an Sentinel-Synology übertragen
        env:
          SENTINEL_DEPLOY_TOKEN: ${{ secrets.SENTINEL_DEPLOY_TOKEN }}
          SENTINEL_URL: ${{ vars.SENTINEL_URL || 'https://sentinel.ng-lab.de' }}
          IPA_FILE: Sentinel-0.6.0-70.ipa
        run: |
          set -euo pipefail
          if [ -z "$SENTINEL_DEPLOY_TOKEN" ]; then
            echo "::error::GitHub-Secret SENTINEL_DEPLOY_TOKEN fehlt."
            exit 1
          fi
          curl --fail --silent --show-error \
            --retry 2 --retry-delay 2 \
            -X POST "$SENTINEL_URL/api/v1/deploy/release?version=0.6.0&build=70" \
            -H "Authorization: Bearer $SENTINEL_DEPLOY_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$RUNNER_TEMP/$IPA_FILE"
