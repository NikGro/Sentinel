name: Server

on:
  push:
    branches: [main, "claude/**"]
    paths: ["server/**", "kern/**", "tools/kern-web.sh", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "kern/**", "tools/kern-web.sh", ".github/workflows/server.yml"]

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typprüfung, Tests, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            server/web/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Gemeinsamer Kern für Sentinel Web ist aktuell
        working-directory: .
        run: |
          ./tools/kern-web.sh
          git diff --exit-code -- server/web/src/kern || { echo "server/web/src/kern ist veraltet: tools/kern-web.sh ausführen und einchecken."; exit 1; }
      - run: npm ci
      - run: npm ci --prefix web
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Abhängigkeiten auf bekannte Schwachstellen prüfen
        run: npm audit --omit=dev --audit-level=high
      - name: Quellpaket für die Bereitstellung
        run: tar -czf ../sentinel-server.tar.gz --exclude=node_modules --exclude=dist --exclude=test -C .. server deploy
      - uses: actions/upload-artifact@v5
        with:
          name: sentinel-server
          path: sentinel-server.tar.gz
          retention-days: 14
