name: iOS-App (Neubau)

on:
  push:
    branches: [main, "claude/**"]
    paths: ["apple/**", "kern/**", ".github/workflows/apple.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bauen:
    name: Bauen und testen
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5

      - name: Kern als XCFramework
        run: ./gradlew -p kern assembleSentinelKernReleaseXCFramework --console=plain

      - name: Projekt erzeugen
        run: |
          brew install xcodegen
          cd apple && xcodegen generate

      - name: Bauen und Start-Test im Simulator
        run: |
          cd apple
          GERAET=$(xcrun simctl list devices available | grep -m1 -o "iPhone 1[0-9][^(]*" | sed 's/ *$//')
          echo "Simulator: $GERAET"
          set -o pipefail
          xcodebuild test -project Sentinel.xcodeproj -scheme Sentinel -destination "platform=iOS Simulator,name=$GERAET" \
            -resultBundlePath build/ergebnis.xcresult CODE_SIGNING_ALLOWED=NO | tee build.log | grep -E "error:|warning: unused|Test Case|\*\* (BUILD|TEST)" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build.log

      - name: Bildschirmfotos
        if: always()
        run: |
          mkdir -p bilder
          xcrun xcresulttool export attachments --path apple/build/ergebnis.xcresult --output-path bilder 2>/dev/null || true
          grep -E "error:" apple/build.log | head -60 | tee bilder/fehler.txt || true
          ls bilder
          for b in $(find bilder -name "*.png" | head -6); do sips -Z 900 "$b" >/dev/null 2>&1 || true; echo "=====BILD $b====="; base64 -i "$b" | tr -d '\n'; echo; echo "=====BILD-ENDE====="; done
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: apple-bilder
          path: bilder/
          retention-days: 14
