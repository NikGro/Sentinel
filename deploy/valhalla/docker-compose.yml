# Routing-Dienst für die Weg-Zeit-Berechnung (Aufenthaltsbereich der Zielperson).
# Optionaler Baustein: Ohne ihn rechnet der Sentinel-Server mit einem Näherungsmodell.
# Der Dienst ist nur im internen Docker-Netz "sentinel" erreichbar, es wird kein Port veröffentlicht.
name: sentinel-routing

services:
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    container_name: Sentinel-Valhalla
    restart: unless-stopped
    environment:
      # Kartenausschnitt: ganz Deutschland (Geofabrik). Erster Aufbau etwa eine Stunde, belegt rund 10 GB.
      # Ohne Ausfall neu bauen: in einem zweiten Container mit serve_tiles=False in ein eigenes Verzeichnis bauen,
      # dann hier das Verzeichnis tauschen.
      tile_urls: https://download.geofabrik.de/europe/germany-latest.osm.pbf
      server_threads: "2"
      serve_tiles: "True"
      build_elevation: "False"
      build_admins: "False"
      build_time_zones: "False"
      build_tar: "True"
      force_rebuild: "False"
    volumes:
      - ./data-de:/custom_files
    networks: [sentinel]
    # Beim Neuaufbau von ganz Deutschland zeitweise mehr als 6 GB.
    mem_limit: 10g
    # Synology-Kernel kennt keine CPU-Quoten, deshalb nur eine niedrige Gewichtung.
    cpu_shares: 256

networks:
  sentinel:
    name: sentinel
    external: true
