# Xcode-Projektbeschreibung für XcodeGen (https://github.com/yonaskolb/XcodeGen).
# Das .xcodeproj wird nicht eingecheckt, sondern mit `xcodegen generate` erzeugt.
name: Sentinel
options:
  bundleIdPrefix: de.nglab
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: de
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.40.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Einzige Fremdbibliothek: der quelloffene Navigationskern Ferrostar (BSD-Lizenz), ohne dessen Kartenoberfläche.

packages:
  Ferrostar:
    url: https://github.com/stadiamaps/ferrostar
    exactVersion: 0.59.0

targets:
  Sentinel:
    type: application
    platform: iOS
    sources:
      - path: Sentinel
    dependencies:
      - package: Ferrostar
        product: FerrostarCore
      # Live-Aktivität „Standort wird geteilt“ (Dynamic Island, Sperrbildschirm).
      - target: SentinelStatus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.nglab.sentinel
        PRODUCT_NAME: Sentinel
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        # Die App wird unsigniert gebaut und von SideStore mit der eigenen Apple-ID signiert.
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
    info:
      path: Sentinel/Resources/Info.plist
      properties:
        CFBundleDisplayName: SENTINEL
        CFBundleDevelopmentRegion: de
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Immer hochkant: Die Bedienung ist auf das Hochformat ausgelegt.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - location
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSLocationWhenInUseUsageDescription: Ihr Standort wird mit dem Einsatzteam auf der Lagekarte geteilt.
        NSLocationAlwaysAndWhenInUseUsageDescription: Ihr Standort wird auch im Hintergrund mit dem Einsatzteam geteilt.
        NSCameraUsageDescription: Für Fotos von Profil, Fahrzeug, Ziel und im Chat.
        NSMicrophoneUsageDescription: Für Sprachnachrichten im Einsatz-Chat und die Spracheingabe des Navigationsziels.
        NSSpeechRecognitionUsageDescription: Das gesprochene Navigationsziel wird auf dem Gerät in Text umgewandelt.
        NSFaceIDUsageDescription: Schützt die App vor unbefugtem Zugriff.
        # Ausschließlich verschlüsselte Verbindungen, keine Ausnahmen.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false

  SentinelStatus:
    type: app-extension
    platform: iOS
    sources:
      - path: SentinelStatus
      - path: Sentinel/Core/Services/SharingActivity.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.nglab.sentinel.status
        PRODUCT_NAME: SentinelStatus
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
    info:
      path: SentinelStatus/Info.plist
      properties:
        CFBundleDisplayName: SENTINEL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  SentinelTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SentinelTests
    dependencies:
      - target: Sentinel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.nglab.sentinel.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

  SentinelUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SentinelUITests
    dependencies:
      - target: Sentinel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.nglab.sentinel.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        TEST_TARGET_NAME: Sentinel

schemes:
  Sentinel:
    build:
      targets:
        Sentinel: all
        SentinelTests: [test]
        SentinelUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SentinelTests
        - SentinelUITests
    archive:
      config: Release
